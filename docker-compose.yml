services:
  db:
    image: mysql:8.0
    container_name: compose-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  mongo:
    image: mongo:latest
    container_name: compose-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  web:
    image: seulminbae/ybigta-newbie-4:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - mongo

volumes:
  db_data:
  mongo_data: