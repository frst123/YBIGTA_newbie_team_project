[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ybigta-review-mcp"
version = "0.1.0"
description = "Read-only MCP tools for the YBIGTA Gyeongbokgung review dataset"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
